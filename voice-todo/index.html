<!doctype html>
<!--
  Voice Todo & Notes: prototype
  ------------------------------
  One file, no build step. Run it from a local server so Chrome allows
  the microphone later (Step 3):

      npx serve voice-todo        then open http://localhost:3000

  Built in steps (see PROTOTYPE.md). Done so far:
  Step 1: layout, tabs, quick add, tick, edit, delete, saved in localStorage
  Step 2: carried-over tasks, Upcoming tab, Done section, change a task's date
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Suara Tugas</title>
<style>
/* =========================================================
   1. DESIGN TOKENS
   Change --accent to try another color. Everything that uses
   the accent (buttons, tick, focus ring) follows it.
   ========================================================= */
:root {
  --accent: #2a9d8f;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-contrast: #ffffff;   /* text/icons on top of the accent */

  /* Light mode colors */
  --page: #eef1f3;      /* behind the phone column on desktop */
  --bg: #ffffff;        /* the app itself */
  --surface: #f4f6f7;   /* input fields, hover */
  --text: #1c2326;
  --muted: #6b777c;
  --line: #e4e8ea;
  --danger: #d1495b;
  --late: #b7700a;      /* date label on carried-over tasks */
  --shadow: 0 10px 40px rgba(20, 30, 35, .08);

  /* Shapes and sizes */
  --radius: 28px;
  --radius-sm: 14px;
  --tap: 48px;          /* minimum size of anything you tap */
  --col: 420px;         /* phone-width column on desktop */
  --ease: cubic-bezier(.2, .8, .2, 1);

  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* Dark mode: same token names, different values. Follows the system. */
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0b0f10;
    --bg: #121719;
    --surface: #1b2225;
    --text: #e8eef0;
    --muted: #8b989d;
    --line: #253034;
    --danger: #ef6f80;
    --late: #e3a548;
    --shadow: 0 10px 40px rgba(0, 0, 0, .45);
  }
}

/* =========================================================
   2. BASE
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
/* Make the "hidden" attribute always win over display rules below. */
[hidden] { display: none !important; }
/* Visible to screen readers only. */
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* =========================================================
   3. APP LAYOUT
   A column: header, scrolling main area, footer (quick add + tabs).
   ========================================================= */
.app {
  position: relative;
  max-width: var(--col);
  height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* On a wide screen, float the app like a phone in the middle.
   The space around it is padding on body, not margin on .app: a top margin
   would "leak" out of body and make the page scroll by 24px. */
@media (min-width: 480px) {
  body { padding: 24px 0; }
  .app {
    height: min(100dvh - 48px, 880px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
}

.header { padding: 28px 24px 12px; }
.eyebrow { margin: 0 0 4px; font-size: .85rem; color: var(--muted); }
.header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -.01em; }

.banner {
  margin: 0 16px 8px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  color: var(--danger);
  font-size: .85rem;
  line-height: 1.4;
}

.main { flex: 1; overflow-y: auto; padding: 4px 12px 24px; }

/* =========================================================
   4. SECTIONS (Tertunda, Hari ini, Selesai, and date groups)
   ========================================================= */
.section + .section { margin-top: 18px; }
.section-title {
  margin: 0;
  padding: 6px 10px 4px;
  font-size: .8rem; font-weight: 600; letter-spacing: .02em;
  color: var(--muted);
}

/* The "Selesai" header is a button that opens and closes the list. */
.section-toggle {
  width: 100%;
  min-height: 44px;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border: 0; border-radius: var(--radius-sm); background: none;
  color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .02em;
  cursor: pointer;
}
@media (hover: hover) { .section-toggle:hover { background: var(--surface); } }
.section-toggle .icon { width: 16px; height: 16px; transition: transform .2s var(--ease); }
.section-toggle[aria-expanded="true"] .icon { transform: rotate(90deg); }
.count {
  min-width: 22px; padding: 1px 7px;
  border-radius: 999px; background: var(--surface);
  font-size: .75rem; text-align: center;
}

/* =========================================================
   5. TASK ROWS
   ========================================================= */
.task-list { list-style: none; margin: 0; padding: 0; }
.task {
  display: flex;
  align-items: flex-start;
  gap: 2px;
  min-height: 56px;
  padding: 2px 4px;
  border-radius: var(--radius-sm);
  transition: background .15s;
}
@media (hover: hover) { .task:hover { background: var(--surface); } }

/* The round tick button. The ring is the visible circle,
   the button around it is bigger so it is easy to hit. */
.check {
  flex: none;
  width: var(--tap); height: var(--tap);
  margin-top: 2px;
  display: grid; place-items: center;
  padding: 0; border: 0; background: none; cursor: pointer;
  border-radius: 50%;
}
.ring {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border: 2px solid var(--muted);
  border-radius: 50%;
  transition: background .2s, border-color .2s;
}
.ring svg {
  width: 14px; height: 14px;
  fill: none; stroke: var(--accent-contrast); stroke-width: 3;
  stroke-linecap: round; stroke-linejoin: round;
  /* The check mark is "drawn" by animating the dash offset. */
  stroke-dasharray: 20; stroke-dashoffset: 20;
}
.task.is-done .ring { background: var(--accent); border-color: var(--accent); }
.task.is-done .ring svg { stroke-dashoffset: 0; }

/* Played once, only on the row you just ticked. */
.task.pop .ring { animation: pop .35s var(--ease); }
.task.pop.is-done .ring svg { animation: draw .3s .05s var(--ease) both; }
@keyframes pop  { 40% { transform: scale(.78); } 100% { transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }

/* The middle part of a row: the task text (a button, tap to edit)
   or, while editing, the input plus date chips. */
.task-body { flex: 1; min-width: 0; }
.title {
  display: flex; flex-direction: column; gap: 2px;
  min-height: 52px; justify-content: center;
  padding: 10px 6px;
  border: 0; background: none;
  text-align: left; font-size: 1rem; line-height: 1.4;
  overflow-wrap: anywhere;
  cursor: text;
  -webkit-user-select: text; user-select: text;
}
.meta { font-size: .78rem; color: var(--muted); }
.meta.is-late { color: var(--late); }
.task.is-done .title-text {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--muted);
}

.editing { padding: 6px 0 8px; }
.edit-input {
  width: 100%;
  padding: 9px 10px;
  border: 2px solid var(--accent);
  border-radius: 10px;
  background: var(--bg);
  font-size: 1rem;
  outline: none;
}
.edit-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface);
  font-size: .85rem;
  cursor: pointer;
}
.chip.is-active { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.date-picker { padding: 0 10px; }

/* Small delete button at the end of each row. */
.delete {
  flex: none;
  width: 40px; height: 40px;
  margin-top: 6px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%; background: none;
  color: var(--muted); opacity: .6; cursor: pointer;
  transition: opacity .15s, color .15s, background .15s;
}
.delete:hover, .delete:focus-visible {
  opacity: 1; color: var(--danger);
  background: color-mix(in srgb, var(--danger) 10%, transparent);
}

/* New or moved tasks slide in gently. */
.task.enter { animation: slide-in .35s var(--ease); }
@keyframes slide-in { from { opacity: 0; transform: translateY(8px); } }

/* Empty screens */
.empty { padding: 56px 24px; text-align: center; color: var(--muted); line-height: 1.5; }
.empty strong { display: block; margin-bottom: 4px; color: var(--text); font-weight: 600; }

/* Shared icon style for the small line icons. */
.icon {
  width: 20px; height: 20px;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}

/* =========================================================
   6. FOOTER: QUICK ADD + TAB BAR
   ========================================================= */
.footer {
  flex: none;
  border-top: 1px solid var(--line);
  background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom);
}
.quick-add { display: flex; gap: 8px; padding: 12px 16px 2px; }
.quick-add input {
  flex: 1; min-width: 0;
  height: var(--tap);
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 1rem;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.quick-add input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.quick-add button {
  flex: none;
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: var(--accent); color: var(--accent-contrast);
  cursor: pointer;
  transition: opacity .15s, transform .15s var(--ease);
}
.quick-add button:disabled { opacity: .35; cursor: default; }
.quick-add button:not(:disabled):active { transform: scale(.92); }

/* Five slots: two tabs, the mic in the middle, two tabs. */
.tabbar {
  display: grid;
  grid-template-columns: 1fr 1fr 84px 1fr 1fr;
  align-items: end;
  padding: 4px 6px 8px;
}
.tab {
  min-height: 52px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 0; border-radius: var(--radius-sm); background: none;
  color: var(--muted); font-size: .72rem;
  cursor: pointer;
  transition: color .15s;
}
.tab .icon { width: 22px; height: 22px; stroke-width: 1.8; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

.mic {
  justify-self: center;
  width: 64px; height: 64px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: var(--accent); color: var(--accent-contrast);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent);
  transform: translateY(-8px);
  cursor: pointer;
  transition: transform .15s var(--ease);
}
.mic:active { transform: translateY(-8px) scale(.93); }
.mic .icon { width: 28px; height: 28px; }

/* =========================================================
   7. TOAST (small message with an optional action)
   ========================================================= */
.toast {
  position: absolute; left: 16px; right: 16px; bottom: 160px;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 8px 8px 16px;
  border-radius: var(--radius-sm);
  background: var(--text); color: var(--bg);
  box-shadow: var(--shadow);
  font-size: .95rem;
  opacity: 0; transform: translateY(10px); pointer-events: none;
  transition: opacity .2s, transform .25s var(--ease);
}
.toast.show { opacity: 1; transform: none; pointer-events: auto; }
.toast span { flex: 1; padding: 8px 0; }
.toast button {
  flex: none; min-height: 40px; padding: 0 12px;
  border: 0; border-radius: 10px; background: none;
  color: color-mix(in srgb, var(--accent) 70%, var(--bg));
  font-weight: 700; cursor: pointer;
}

/* Respect "reduce motion" in the system settings. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <p class="eyebrow" id="headerEyebrow"></p>
    <h1 id="headerTitle">Hari ini</h1>
  </header>

  <div class="banner" id="storageBanner" role="alert" hidden>
    Penyimpanan browser diblokir. Data hanya tersimpan sampai halaman ditutup.
  </div>

  <main class="main" id="main"></main>

  <footer class="footer" id="footer">
    <form class="quick-add" id="quickAdd" autocomplete="off">
      <label class="sr-only" for="quickAddInput">Tugas baru</label>
      <input id="quickAddInput" type="text" placeholder="Tambah tugas…" maxlength="200" enterkeyhint="enter">
      <button type="submit" id="quickAddBtn" aria-label="Tambah" disabled>
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </button>
    </form>

    <nav class="tabbar" aria-label="Menu utama">
      <button class="tab" type="button" data-tab="today">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15 16 9.5"/></svg>
        Hari ini
      </button>
      <button class="tab" type="button" data-tab="upcoming">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        Mendatang
      </button>
      <button class="mic" type="button" id="micBtn" aria-label="Bicara">
        <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/></svg>
      </button>
      <button class="tab" type="button" data-tab="notes">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 3.5h8l4.5 4.5v12.5H6z"/><path d="M14 3.5V8h4.5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="13" y2="16.5"/></svg>
        Catatan
      </button>
      <button class="tab" type="button" data-tab="settings">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" style="fill: var(--bg)"/><circle cx="15" cy="17" r="2.4" style="fill: var(--bg)"/></svg>
        Atur
      </button>
    </nav>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button type="button" id="toastAction" hidden></button>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   1. SETTINGS AND SMALL HELPERS
   ========================================================= */

const TIME_ZONE = 'Asia/Jakarta';   // "today" is always calculated here
const STORAGE_KEYS = {
  tasks: 'vt.tasks',
  // Later steps add: captures: 'vt.captures', notes: 'vt.notes', settings: 'vt.settings'
};
const TOAST_MS = 5000;              // how long a toast stays on screen
const SETTLE_MS = 700;              // how long a ticked task stays in place before moving to "Selesai"

// Shortcut for document.querySelector.
const $ = (selector) => document.querySelector(selector);

// Create an element with attributes in one line: el('li', { class: 'task' })
function el(tag, attrs = {}) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  return node;
}

// Unique id in the same format Supabase uses (UUID v4).
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  // Fallback for very old browsers: build a v4 UUID by hand.
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

/* =========================================================
   2. STORAGE
   Every read and write goes through these two functions,
   each wrapped in try/catch. If localStorage is blocked
   (private mode, browser setting), the app keeps working
   in memory and shows a warning banner.
   ========================================================= */

function loadData(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (err) {
    console.warn('Gagal membaca', key, err);
    // A SyntaxError means the saved text is broken, not that storage is blocked.
    if (!(err instanceof SyntaxError)) showStorageWarning();
    return fallback;
  }
}

function saveData(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (err) {
    console.warn('Gagal menyimpan', key, err);
    showStorageWarning();
    return false;
  }
}

function showStorageWarning() {
  $('#storageBanner').hidden = false;
}

/* =========================================================
   3. DATES
   Dates are stored as plain text 'YYYY-MM-DD' (same as the
   real app). Timestamps are full ISO strings in UTC.
   'YYYY-MM-DD' strings can be compared with < and > directly,
   because they sort the same way as the dates they stand for.
   ========================================================= */

// Formats a moment as a Jakarta date, e.g. '2026-11-07'.
// The 'en-CA' locale happens to format dates as YYYY-MM-DD.
const JAKARTA_DATE = new Intl.DateTimeFormat('en-CA', {
  timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit',
});

// Today's date in Jakarta.
function todayISO() {
  return JAKARTA_DATE.format(new Date());
}

// The Jakarta date of a timestamp, e.g. when a task was ticked.
function dateOfStamp(stamp) {
  return stamp ? JAKARTA_DATE.format(new Date(stamp)) : null;
}

// Moment in time for created_at, updated_at, done_at.
function nowStamp() {
  return new Date().toISOString();
}

// Header label in Indonesian, e.g. 'Sabtu, 7 Nov'.
function todayLabel() {
  return new Intl.DateTimeFormat('id-ID', {
    timeZone: TIME_ZONE, weekday: 'long', day: 'numeric', month: 'short',
  }).format(new Date());
}

// Date math on 'YYYY-MM-DD' strings. We treat the date as midnight UTC
// so time zones and daylight saving can never shift it by a day.
function isoToDate(iso) {
  return new Date(`${iso}T00:00:00Z`);
}
function addDays(iso, days) {
  const d = isoToDate(iso);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function daysBetween(fromIso, toIso) {
  return Math.round((isoToDate(toIso) - isoToDate(fromIso)) / 86400000);
}

// 'Senin 10 Nov' (weekday 'long') or 'Sen 10 Nov' (weekday 'short').
// Adds the year when it is not this year: 'Senin 4 Jan 2027'.
function formatDay(iso, weekday = 'long') {
  const options = { timeZone: 'UTC', weekday, day: 'numeric', month: 'short' };
  if (iso.slice(0, 4) !== todayISO().slice(0, 4)) options.year = 'numeric';
  return new Intl.DateTimeFormat('id-ID', options)
    .formatToParts(isoToDate(iso))
    .filter((part) => part.type !== 'literal')   // drop the comma and spaces
    .map((part) => part.value.replace('.', ''))  // some browsers write 'Agu.'
    .join(' ');
}

// Friendly name for a date compared to today: Kemarin, Hari ini, Besok, Lusa,
// or the full date for anything further away.
function dayLabel(iso, weekday = 'long') {
  const diff = daysBetween(todayISO(), iso);
  if (diff === -1) return 'Kemarin';
  if (diff === 0) return 'Hari ini';
  if (diff === 1) return 'Besok';
  if (diff === 2) return 'Lusa';
  return formatDay(iso, weekday);
}

/* =========================================================
   4. APP STATE
   Everything the screen shows comes from this one object.
   We change the state, save it, then call render().
   ========================================================= */

const state = {
  tasks: [],            // all tasks, in the order they were added
  tab: 'today',         // 'today' | 'upcoming' | 'notes' | 'settings'
  doneOpen: false,      // is the "Selesai" section expanded?
  editingId: null,      // id of the task being edited, or null
  settling: new Set(),  // just-ticked tasks that wait a moment before moving
  justAddedId: null,    // used once to play the slide-in animation
  justToggledId: null,  // used once to play the tick animation
};

function saveTasks() {
  saveData(STORAGE_KEYS.tasks, state.tasks);
}

function findTask(id) {
  return state.tasks.find((t) => t.id === id);
}

/* =========================================================
   5. WHICH TASK GOES WHERE
   Nothing about "carried over" is stored. A task just keeps
   its task_date, and we work out its place every render:

   Tertunda  : not done, task_date before today
   Hari ini  : not done, task_date is today
   Mendatang : not done, task_date after today
   Selesai   : ticked today (done_at is today in Jakarta)

   So at midnight, unfinished tasks move to "Tertunda" by
   themselves, with no extra code.
   ========================================================= */

// A just-ticked task is already done in the data, but we keep it
// in its old place for a moment so you can see the tick animation.
function placedAsDone(task) {
  return task.is_done && !state.settling.has(task.id);
}

function todaySections() {
  const today = todayISO();
  const open = state.tasks.filter((t) => !placedAsDone(t));
  return {
    // Oldest first, so the longest-waiting task is on top.
    carried: open
      .filter((t) => t.task_date < today)
      .sort((a, b) => a.task_date.localeCompare(b.task_date)),
    today: open.filter((t) => t.task_date === today),
    // Most recently ticked first.
    done: state.tasks
      .filter((t) => placedAsDone(t) && dateOfStamp(t.done_at) === today)
      .sort((a, b) => b.done_at.localeCompare(a.done_at)),
  };
}

// Future tasks grouped by date: [['2026-11-08', [task, task]], ...]
function upcomingGroups() {
  const today = todayISO();
  const groups = new Map();
  state.tasks
    .filter((t) => !placedAsDone(t) && t.task_date > today)
    .sort((a, b) => a.task_date.localeCompare(b.task_date))
    .forEach((t) => {
      if (!groups.has(t.task_date)) groups.set(t.task_date, []);
      groups.get(t.task_date).push(t);
    });
  return [...groups];
}

/* =========================================================
   6. TASK ACTIONS
   ========================================================= */

// Build a task object with every field the real app has.
// Fields not used yet stay null so the shape is already right.
function createTask(title, extra = {}) {
  const now = nowStamp();
  return {
    id: newId(),
    title,
    note: null,
    task_date: todayISO(),   // 'YYYY-MM-DD'
    due_time: null,          // 'HH:MM' or null
    is_done: false,
    done_at: null,
    source: 'manual',        // 'manual' | 'voice'
    capture_id: null,        // links a voice task to its capture (Step 4)
    created_at: now,
    updated_at: now,
    ...extra,
  };
}

// Collapse extra spaces and trim the ends.
function cleanTitle(text) {
  return text.replace(/\s+/g, ' ').trim();
}

function addTask(text) {
  const title = cleanTitle(text);
  if (!title) return;
  saveOpenEdit();
  const task = createTask(title);
  state.tasks.push(task);
  state.justAddedId = task.id;
  saveTasks();
  render();
}

function toggleTask(id) {
  saveOpenEdit();
  const task = findTask(id);
  if (!task) return;
  task.is_done = !task.is_done;
  task.done_at = task.is_done ? nowStamp() : null;
  task.updated_at = nowStamp();
  saveTasks();
  state.justToggledId = id;

  if (task.is_done) {
    // Stay in place for a moment, then move to "Selesai".
    state.settling.add(id);
    setTimeout(() => {
      state.settling.delete(id);
      if (findTask(id)?.is_done) state.justAddedId = id; // slide into "Selesai"
      render();
    }, SETTLE_MS);
  } else {
    state.settling.delete(id);
  }
  render();
}

function renameTask(id, text) {
  const task = findTask(id);
  const title = cleanTitle(text);
  // An empty title keeps the old one, so you can't lose a task by accident.
  if (!task || !title || title === task.title) return;
  task.title = title;
  task.updated_at = nowStamp();
  saveTasks();
}

// Give a task another date. Shows a toast with Undo.
function moveTask(id, newDate) {
  saveOpenEdit();
  const task = findTask(id);
  if (!task || !newDate || task.task_date === newDate) { render(); return; }

  const oldDate = task.task_date;
  task.task_date = newDate;
  task.updated_at = nowStamp();
  state.justAddedId = id;
  saveTasks();
  render();

  // 'Besok' reads better as 'besok' in the middle of a sentence.
  const label = dayLabel(newDate);
  const nice = ['Kemarin', 'Hari ini', 'Besok', 'Lusa'].includes(label) ? label.toLowerCase() : label;
  showToast(`Dipindah ke ${nice}`, {
    actionLabel: 'Urungkan',
    onAction: () => {
      const t = findTask(id);
      if (!t) return;
      t.task_date = oldDate;
      t.updated_at = nowStamp();
      state.justAddedId = id;
      saveTasks();
      render();
    },
  });
}

// The last deleted task and where it was, so Undo can put it back.
let lastDeleted = null;

function deleteTask(id) {
  saveOpenEdit();
  const index = state.tasks.findIndex((t) => t.id === id);
  if (index === -1) return;
  const [task] = state.tasks.splice(index, 1);
  lastDeleted = { task, index };
  saveTasks();
  render();
  showToast('Tugas dihapus', { actionLabel: 'Urungkan', onAction: undoDelete });
}

function undoDelete() {
  if (!lastDeleted) return;
  const { task, index } = lastDeleted;
  state.tasks.splice(Math.min(index, state.tasks.length), 0, task);
  lastDeleted = null;
  state.justAddedId = task.id;
  saveTasks();
  render();
}

/* =========================================================
   7. EDITING A TASK
   Tap the text: it turns into an input with date chips
   (Hari ini, Besok, Lusa, or pick a date).
   Enter or tapping outside the row saves. Esc cancels.
   ========================================================= */

function startEdit(id) {
  saveOpenEdit();
  state.editingId = id;
  render();
}

// Save whatever is typed in the open edit field (if any) and close it.
// Used before any other action, so typed text is never lost.
function saveOpenEdit() {
  if (!state.editingId) return;
  const input = $('#main .edit-input');
  if (input) renameTask(state.editingId, input.value);
  state.editingId = null;
}

function finishEdit(save) {
  const id = state.editingId;
  if (!id) return;               // already finished (guards double calls)
  const row = $('#main .editing')?.closest('.task');
  if (save) saveOpenEdit();
  state.editingId = null;

  // Swap only this row's edit area back to text instead of redrawing the
  // whole list. This way a tap on another row still lands where you aimed.
  const task = findTask(id);
  if (row && row.isConnected && task) {
    row.querySelector('.task-body').replaceWith(titleButton(task, row.dataset.section));
  }
}

/* =========================================================
   8. RENDERING
   render() redraws the screen from the state. Simple and
   predictable: the data is the truth, the screen follows.
   ========================================================= */

const TAB_TITLES = {
  today: 'Hari ini',
  upcoming: 'Mendatang',
  notes: 'Catatan',
  settings: 'Pengaturan',
};

const CHECK_SVG = '<span class="ring"><svg viewBox="0 0 16 16"><polyline points="3.5 8.5 6.5 11.5 12.5 5"/></svg></span>';
const X_SVG = '<svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px"><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></svg>';
const CHEVRON_SVG = '<svg class="icon" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>';

function render() {
  // If something redraws the list while you are typing in an edit field
  // (for example a ticked task moving to "Selesai"), keep what you typed.
  const openInput = $('#main .edit-input');
  const openRow = openInput?.closest('.task');
  state.editDraft = openRow && openRow.dataset.id === state.editingId ? openInput.value : null;

  renderHeader();
  renderTabs();
  renderMain();
  $('#quickAdd').hidden = state.tab !== 'today';

  // The one-time animation flags are used up after one render.
  state.justAddedId = null;
  state.justToggledId = null;
}

function renderHeader() {
  $('#headerTitle').textContent = TAB_TITLES[state.tab];
  let eyebrow = todayLabel();
  if (state.tab === 'today') {
    const { carried, today } = todaySections();
    const left = carried.length + today.filter((t) => !t.is_done).length;
    if (left > 0) eyebrow += ` · ${left} tersisa`;
  }
  $('#headerEyebrow').textContent = eyebrow;
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach((btn) => {
    if (btn.dataset.tab === state.tab) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
}

function renderMain() {
  const main = $('#main');
  if (state.tab === 'today') renderToday(main);
  else if (state.tab === 'upcoming') renderUpcoming(main);
  else {
    // These tabs get real content in later steps.
    const placeholders = {
      notes: ['Belum ada catatan', 'Catatan kamu akan muncul di sini.'],
      settings: ['Pengaturan', 'Bahasa, ekspor, dan impor data akan ada di sini.'],
    };
    main.replaceChildren(emptyState(...placeholders[state.tab]));
  }

  // If a row is in edit mode, put the cursor in it.
  const input = main.querySelector('.edit-input');
  if (input) {
    input.focus();
    if (state.editDraft === null) input.select();  // fresh edit: select all
  }
}

function renderToday(main) {
  const { carried, today, done } = todaySections();
  const parts = [];

  if (carried.length) parts.push(section('Tertunda', carried, 'carried'));
  // The "Hari ini" heading only helps when there is a section above it.
  if (today.length) parts.push(section(carried.length ? 'Hari ini' : null, today, 'today'));

  if (!carried.length && !today.length) {
    parts.push(done.length
      ? emptyState('Semua beres', 'Tidak ada tugas tersisa hari ini.')
      : emptyState('Belum ada tugas hari ini', 'Ketik di bawah, lalu tekan Enter.'));
  }

  if (done.length) parts.push(doneSection(done));
  main.replaceChildren(...parts);
}

function renderUpcoming(main) {
  const groups = upcomingGroups();
  if (!groups.length) {
    main.replaceChildren(emptyState(
      'Belum ada tugas mendatang',
      'Tap teks tugas di Hari ini, lalu pilih Besok atau tanggal lain.'));
    return;
  }
  main.replaceChildren(...groups.map(([date, tasks]) => section(dayLabel(date), tasks, 'upcoming')));
}

// A heading (optional) plus a list of task rows.
// "kind" says which section the rows belong to; it changes the small label.
function section(title, tasks, kind) {
  const box = el('section', { class: 'section' });
  if (title) {
    const h = el('h2', { class: 'section-title' });
    h.textContent = title;
    box.append(h);
  }
  box.append(taskList(tasks, kind));
  return box;
}

function taskList(tasks, kind) {
  const list = el('ul', { class: 'task-list' });
  tasks.forEach((task) => list.append(taskRow(task, kind)));
  return list;
}

// "Selesai": a header button with a count. The list shows only when open.
function doneSection(tasks) {
  const box = el('section', { class: 'section' });
  const toggle = el('button', {
    class: 'section-toggle', type: 'button',
    'data-action': 'toggle-done', 'aria-expanded': String(state.doneOpen),
  });
  toggle.innerHTML = `${CHEVRON_SVG}<span>Selesai</span><span class="count">${tasks.length}</span>`;
  box.append(toggle);
  if (state.doneOpen) box.append(taskList(tasks, 'done'));
  return box;
}

function taskRow(task, kind) {
  const row = el('li', { class: 'task', 'data-id': task.id, 'data-section': kind });
  if (task.is_done) row.classList.add('is-done');
  if (task.id === state.justAddedId) row.classList.add('enter');
  if (task.id === state.justToggledId) row.classList.add('pop');

  const check = el('button', {
    class: 'check', type: 'button', 'data-action': 'toggle',
    'aria-pressed': String(task.is_done),
    'aria-label': task.is_done ? 'Tandai belum selesai' : 'Tandai selesai',
  });
  check.innerHTML = CHECK_SVG;

  const body = task.id === state.editingId ? editPanel(task) : titleButton(task, kind);

  const del = el('button', { class: 'delete', type: 'button', 'data-action': 'delete', 'aria-label': 'Hapus tugas' });
  del.innerHTML = X_SVG;

  row.append(check, body, del);
  return row;
}

// The tappable task text, with a small label under it when useful.
// textContent (not innerHTML) keeps typed text safe.
function titleButton(task, kind) {
  const btn = el('button', { class: 'title task-body', type: 'button', 'data-action': 'edit' });
  const text = el('span', { class: 'title-text' });
  text.textContent = task.title;
  btn.append(text);

  const bits = [];
  if (kind === 'carried') bits.push(dayLabel(task.task_date, 'short'));  // 'Kemarin', 'Kam 5 Nov'
  if (task.due_time) bits.push(task.due_time);                          // '15:00' (from voice, Step 4)
  if (bits.length) {
    const meta = el('span', { class: kind === 'carried' ? 'meta is-late' : 'meta' });
    meta.textContent = bits.join(' · ');
    btn.append(meta);
  }
  return btn;
}

// Edit mode: the title input plus quick date chips and a date picker.
function editPanel(task) {
  const box = el('div', { class: 'task-body editing' });

  const input = el('input', { class: 'edit-input', type: 'text', maxlength: '200', 'aria-label': 'Ubah tugas' });
  input.value = state.editDraft ?? task.title;

  const dates = el('div', { class: 'edit-dates', role: 'group', 'aria-label': 'Tanggal' });
  const today = todayISO();
  const quick = [['Hari ini', today], ['Besok', addDays(today, 1)], ['Lusa', addDays(today, 2)]];
  for (const [label, iso] of quick) {
    const chip = el('button', { class: 'chip', type: 'button', 'data-action': 'set-date', 'data-date': iso });
    if (task.task_date === iso) chip.classList.add('is-active');
    chip.textContent = label;
    dates.append(chip);
  }

  // The native date picker covers any other day.
  const picker = el('input', { class: 'chip date-picker', type: 'date', 'aria-label': 'Pilih tanggal lain' });
  picker.value = task.task_date;
  if (!quick.some(([, iso]) => iso === task.task_date)) picker.classList.add('is-active');
  dates.append(picker);

  box.append(input, dates);
  return box;
}

function emptyState(heading, text) {
  const box = el('div', { class: 'empty' });
  const strong = el('strong');
  strong.textContent = heading;
  box.append(strong, text);
  return box;
}

/* =========================================================
   9. TOAST
   ========================================================= */

let toastTimer = null;

function showToast(message, { actionLabel, onAction } = {}) {
  const toast = $('#toast');
  const action = $('#toastAction');
  $('#toastText').textContent = message;

  if (actionLabel) {
    action.textContent = actionLabel;
    action.hidden = false;
    action.onclick = () => { hideToast(); onAction(); };
  } else {
    action.hidden = true;
    action.onclick = null;
  }

  // Sit just above the footer, whatever its height is right now.
  toast.style.bottom = `${$('#footer').offsetHeight + 12}px`;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, TOAST_MS);
}

function hideToast() {
  $('#toast').classList.remove('show');
}

/* =========================================================
   10. EVENTS
   One listener on the list handles every row ("event
   delegation"), so we don't attach listeners per task.
   ========================================================= */

const main = $('#main');

main.addEventListener('click', (event) => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const action = button.dataset.action;

  if (action === 'toggle-done') {
    state.doneOpen = !state.doneOpen;
    render();
    return;
  }

  const id = button.closest('.task')?.dataset.id;
  if (!id) return;
  if (action === 'toggle') toggleTask(id);
  else if (action === 'edit') startEdit(id);
  else if (action === 'delete') deleteTask(id);
  else if (action === 'set-date') moveTask(id, button.dataset.date);
});

// Picking a day in the date picker moves the task right away.
main.addEventListener('change', (event) => {
  if (!event.target.classList.contains('date-picker')) return;
  const value = event.target.value;
  // While typing a year digit by digit the value can be '0002-...'; wait for a real one.
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value) || value < '2000') return;
  moveTask(event.target.closest('.task').dataset.id, value);
});

// Keep the cursor in the title field when a date chip is pressed,
// so pressing a chip does not count as "tapping outside".
main.addEventListener('mousedown', (event) => {
  if (event.target.closest('button.chip')) event.preventDefault();
});

main.addEventListener('keydown', (event) => {
  if (!event.target.classList.contains('edit-input')) return;
  if (event.key === 'Enter') { event.preventDefault(); finishEdit(true); }
  if (event.key === 'Escape') { event.preventDefault(); finishEdit(false); }
});

// Tapping outside the row being edited saves the change.
// We wait one tick so the browser has moved focus, then check where it went:
// still inside the row being edited (date picker, chips) means keep editing.
// We look up the row fresh, because the element that lost focus may be an
// old one that render() already replaced (like the title you just tapped).
main.addEventListener('focusout', () => {
  if (!state.editingId) return;
  setTimeout(() => {
    const editingRow = main.querySelector('.editing')?.closest('.task');
    if (!editingRow) return;
    if (!editingRow.contains(document.activeElement)) finishEdit(true);
  }, 0);
});

// Quick add: Enter submits the form.
const quickInput = $('#quickAddInput');
const quickBtn = $('#quickAddBtn');

quickInput.addEventListener('input', () => {
  quickBtn.disabled = cleanTitle(quickInput.value) === '';
});

$('#quickAdd').addEventListener('submit', (event) => {
  event.preventDefault();
  addTask(quickInput.value);
  quickInput.value = '';
  quickBtn.disabled = true;
  quickInput.focus();                 // ready for the next task
  // Scroll so the new task (last in "Hari ini") is visible.
  main.querySelector('.task.enter')?.scrollIntoView({ block: 'nearest' });
});

// Tabs
document.querySelectorAll('.tab').forEach((btn) => {
  btn.addEventListener('click', () => {
    saveOpenEdit();
    state.tab = btn.dataset.tab;
    render();
    main.scrollTop = 0;
  });
});

// The mic is wired up in Step 3.
$('#micBtn').addEventListener('click', () => {
  showToast('Fitur suara segera hadir');
});

// If the app stays open past midnight, refresh "today" when you come back.
// Unfinished tasks then show up under "Tertunda" on their own.
let shownDay = todayISO();
function refreshIfNewDay() {
  if (todayISO() !== shownDay && !state.editingId) {
    shownDay = todayISO();
    render();
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfNewDay(); });
setInterval(refreshIfNewDay, 60 * 1000);

/* =========================================================
   11. START
   ========================================================= */

const saved = loadData(STORAGE_KEYS.tasks, []);
state.tasks = Array.isArray(saved) ? saved : [];
render();
</script>
</body>
</html>
