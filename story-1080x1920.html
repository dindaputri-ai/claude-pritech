  :root {

    --ink: #201d1b;

  }

  /* header */
  .header {
    position: absolute; top: 170px; left: 80px; right: 80px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 700;
    font-size: 34px; letter-spacing: .14em; color: var(--ink);
    display: flex; align-items: center; gap: 14px;
  }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px; background: var(--ink);
    display: grid; place-items: center;
  }
  .logo .mark i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .onair {
    display: flex; align-items: center; gap: 14px;
    background: var(--ink); color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .2em;
    padding: 14px 26px 14px 22px; border-radius: 999px;
    box-shadow: 0 10px 30px rgba(32,29,27,.25);
  }
  .onair .dot {
    width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 5px rgba(242,106,48,.25), 0 0 18px 4px rgba(242,106,48,.85);
  }

  /* paper sheets + main panel */
  .sheet { position: absolute; border-radius: 6px; }
  .sheet.a { left: 92px; top: 372px; width: 880px; height: 1190px; background: var(--cream-2); transform: rotate(-4deg); box-shadow: 0 30px 60px rgba(32,29,27,.18); }
  .sheet.b { left: 120px; top: 352px; width: 870px; height: 1200px; background: var(--cream); transform: rotate(2.5deg); box-shadow: 0 30px 60px rgba(32,29,27,.18); }
  .panel {
    position: absolute; left: 130px; top: 356px; width: 840px; height: 1180px;
    clip-path: polygon(0 8%, 100% 0, 100% 100%, 0 100%);
    background:
      radial-gradient(circle at 0% 100%, rgba(242,106,48,.55) 0%, rgba(242,106,48,0) 45%),
      linear-gradient(205deg, var(--ink) 52%, var(--deep) 125%);
  }
  .panel-content {
    position: absolute; left: 220px; top: 500px; width: 680px; z-index: 6; color: var(--cream);
  }
  .kicker {
    display: flex; align-items: center; gap: 14px;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .24em;
    color: var(--accent);
  }
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 22px; }
  .eq i { width: 5px; background: var(--accent); border-radius: 2px; }
  .title {
    margin-top: 26px;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 700;
    font-size: 138px; line-height: .94; letter-spacing: -.02em; text-transform: uppercase;
    color: var(--cream);
  }
  .topic {
    margin-top: 30px; max-width: 600px;
    font-size: 32px; line-height: 1.35; font-weight: 600; color: rgba(253,251,248,.78);
  }
  .host {
    margin-top: 22px; font-size: 24px; font-weight: 600; color: rgba(253,251,248,.6);
  }
  .host b { color: var(--cream); font-weight: 800; }
  .wave { margin-top: 40px; display: block; }

  /* guest */
  .guest {
    position: absolute; left: 340px; top: 1170px; z-index: 6;
    display: flex; align-items: center; gap: 34px; color: var(--cream);
  }
  .guest-photo {
    position: relative; width: 230px; height: 230px; border-radius: 50%; overflow: hidden; flex: none;
    background: linear-gradient(160deg, var(--taupe) 0%, var(--taupe-dark) 100%);
    box-shadow: 0 0 0 6px var(--accent), 0 0 0 14px rgba(242,106,48,.25), 0 20px 50px rgba(0,0,0,.35);
  }
  .guest-photo img, .guest-photo svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guest-label {
    font-size: 20px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
  }
  .guest-name {
    margin-top: 8px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.05;
  }
  .guest-role { margin-top: 8px; font-size: 24px; font-weight: 600; color: rgba(253,251,248,.75); }

  /* bottom info */
  .info {
    position: absolute; left: 360px; right: 80px; top: 1610px; z-index: 6;
  }
  .when {
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -.005em; color: var(--ink);
  }
  .when .sep { color: var(--cream); margin: 0 12px; }
  .row { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .platform { font-size: 26px; font-weight: 700; color: var(--ink); }
  .platform span { font-weight: 600; opacity: .8; }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--cream);
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 24px;
    padding: 14px 26px; border-radius: 999px;
  }
  .cta svg { display: block; }

  .mic { position: absolute; z-index: 8; }
  .deco { position: absolute; }
</style>
</head>
<body>
<div class="poster">

  <!-- background brush strokes + outline shapes -->
  <svg class="layer" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g fill="none" stroke="#d8521c" stroke-linecap="round" opacity=".75">
      <path d="M-80 380 C 180 240, 360 160, 620 -40" stroke-width="70"/>
      <path d="M-60 760 C 120 640, 200 560, 380 330" stroke-width="44"/>
      <path d="M560 2000 C 760 1850, 1000 1800, 1180 1700" stroke-width="80"/>
      <path d="M-60 1980 C 120 1900, 260 1880, 420 1800" stroke-width="46"/>
      <path d="M980 860 C 1040 780, 1080 760, 1160 690" stroke-width="50"/>
      <path d="M960 120 C 1020 80, 1060 60, 1140 0" stroke-width="36"/>
    </g>
    <!-- outlined headphones, header -->
    <g transform="translate(700 202) rotate(-14) scale(.42)" fill="none" stroke="#fdfbf8" stroke-width="15" stroke-linecap="round" opacity=".9">
      <path d="M-120 40 A 120 120 0 0 1 120 40"/>
      <rect x="-150" y="30" width="56" height="96" rx="20"/>
      <rect x="94" y="30" width="56" height="96" rx="20"/>
    </g>
    <!-- outlined shapes -->
    <rect x="990" y="1020" width="80" height="80" rx="18" fill="none" stroke="#fdfbf8" stroke-width="6" transform="rotate(24 1030 1060)" opacity=".85"/>
    <rect x="1005" y="1140" width="46" height="46" rx="10" fill="#fdfbf8" transform="rotate(-14 1028 1163)" opacity=".9"/>
    <circle cx="66" cy="300" r="12" fill="#201d1b"/>
  </svg>

  <div class="header">
    <!-- LOGO: replace with <img src="logo.png" style="height:44px"> -->
    <div class="logo"><span class="mark"><i></i></span>PRITECH</div>
    <div class="onair"><span class="dot"></span>ON AIR</div>
  </div>

  <div class="sheet a"></div>
  <div class="sheet b"></div>
  <div class="panel"></div>

  <div class="panel-content">
    <div class="kicker">
      <span class="eq"><i style="height:40%"></i><i style="height:100%"></i><i style="height:65%"></i><i style="height:85%"></i></span>
      PRITECH PODCAST
    </div>
    <h1 class="title">[Episode<br>Title]</h1>
    <p class="topic">[One sentence describing the topic]</p>
    <p class="host">Hosted by <b>[HOST NAME]</b></p>
  </div>

  <!-- waveform divider -->
  <svg class="deco" style="left:340px; top:1100px; z-index:6" width="560" height="28" viewBox="0 0 560 28">
    <g fill="#f26a30">
    </g>
  </svg>

  <div class="guest">
    <div class="guest-photo">
      <!-- GUEST PHOTO: replace this <svg> with <img src="guest.jpg" alt=""> -->
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="82" r="38" fill="#fdfbf8" opacity=".55"/>
        <path d="M28 200 C 32 146, 66 126, 100 126 C 134 126, 168 146, 172 200 Z" fill="#fdfbf8" opacity=".55"/>
      </svg>
    </div>
    <div>
      <div class="guest-label">Guest speaker</div>
      <div class="guest-name">[GUEST NAME]</div>
      <div class="guest-role">[Job Title, Company]</div>
    </div>
  </div>

  <div class="info">
    <div class="when">[DAY, DATE]<span class="sep">|</span>[TIME] WIB</div>
    <div class="row">
      <div class="platform"><span>Live on</span> [PLATFORM]</div>
      <div class="cta">Listen live
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#f26a30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h13M12 5l6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <!-- microphone cutout -->
  <svg class="mic" style="left:-10px; top:1010px" width="420" height="720" viewBox="0 0 420 720">
    <defs>
      <linearGradient id="metal" x1="0" x2="1">
        <stop offset="0" stop-color="#201d1b"/>
        <stop offset=".22" stop-color="#8a7d71"/>
        <stop offset=".42" stop-color="#fdfbf8"/>
        <stop offset=".6" stop-color="#b5a99c"/>
        <stop offset="1" stop-color="#201d1b"/>
      </linearGradient>
      <linearGradient id="metalDark" x1="0" x2="1">
        <stop offset="0" stop-color="#201d1b"/>
        <stop offset=".4" stop-color="#8a7d71"/>
        <stop offset=".55" stop-color="#b5a99c"/>
        <stop offset="1" stop-color="#201d1b"/>
      </linearGradient>
      <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <circle cx="4.5" cy="4.5" r="2.4" fill="#201d1b" opacity=".75"/>
      </pattern>
      <radialGradient id="micGlow">
        <stop offset="0" stop-color="#f26a30" stop-opacity=".7"/>
        <stop offset="1" stop-color="#f26a30" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="10" dy="18" stdDeviation="14" flood-color="#201d1b" flood-opacity=".45"/>
      </filter>
    </defs>
    <circle cx="200" cy="200" r="210" fill="url(#micGlow)"/>
    <g transform="translate(210 40) rotate(22)" filter="url(#shadow)">
      <!-- stand -->
      <rect x="-14" y="420" width="28" height="320" fill="url(#metalDark)"/>
      <!-- shock mount -->
      <ellipse cx="0" cy="330" rx="150" ry="34" fill="none" stroke="#201d1b" stroke-width="10"/>
      <ellipse cx="0" cy="330" rx="150" ry="34" fill="none" stroke="#b5a99c" stroke-width="3"/>
      <!-- body -->
      <path d="M-92 250 L 92 250 L 70 440 Q 0 456 -70 440 Z" fill="url(#metal)"/>
      <rect x="-104" y="230" width="208" height="34" rx="10" fill="url(#metalDark)"/>
      <!-- capsule -->
      <rect x="-104" y="-40" width="208" height="290" rx="104" fill="url(#metal)"/>
      <rect x="-104" y="-40" width="208" height="290" rx="104" fill="url(#mesh)"/>
      <rect x="-104" y="-40" width="208" height="290" rx="104" fill="none" stroke="#201d1b" stroke-width="5"/>
      <rect x="-112" y="96" width="224" height="30" rx="8" fill="url(#metalDark)"/>
      <!-- elastic bands -->
      <g stroke="#201d1b" stroke-width="5">
        <line x1="-148" y1="322" x2="-88" y2="282"/><line x1="148" y1="322" x2="88" y2="282"/>
        <line x1="-130" y1="354" x2="-78" y2="392"/><line x1="130" y1="354" x2="78" y2="392"/>
      </g>
      <!-- front ring of shock mount -->
      <path d="M-150 330 A 150 34 0 0 0 150 330" fill="none" stroke="#201d1b" stroke-width="10"/>
      <path d="M-150 330 A 150 34 0 0 0 150 330" fill="none" stroke="#fdfbf8" stroke-width="2.5" opacity=".7"/>
      <!-- highlight -->
      <rect x="-60" y="-10" width="18" height="230" rx="9" fill="#fdfbf8" opacity=".35"/>
    </g>
  </svg>

  <div class="grain"></div>
</div>

<script>
  // waveform divider bars
  (function () {
    var g = document.querySelector('svg.deco g');
    var ns = 'http://www.w3.org/2000/svg';
    var n = 70;
    for (var i = 0; i < n; i++) {
      var h = 4 + Math.abs(Math.sin(i * 0.55) * Math.cos(i * 0.21)) * 24;
      var r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', i * 8);
      r.setAttribute('y', (28 - h) / 2);
      r.setAttribute('width', 4);
      r.setAttribute('height', h);
      r.setAttribute('rx', 2);
      r.setAttribute('opacity', (0.35 + 0.65 * (1 - i / n)).toFixed(2));
      g.appendChild(r);
    }
  })();
</script>
</body>
</html>
